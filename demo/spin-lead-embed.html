<!-- ============================================================
     PASTE-READY WEBFLOW EMBEDS — the /spin-to-win lead form.

     ONE EMBED PER FIELD, matching how /onboarding is built: each input sits
     in its own HTML Embed, inside your own Designer-styled field wrapper, so
     the layout and the glass field look stay yours. Copy the blocks below one
     at a time.

     REQUIRED ONCE PER PAGE: the `field-style` embed from /onboarding (the
     <style> block that makes .fc-field input transparent inside the glass
     wrapper). Without it these inputs render with the browser's white box.

     WHERE IT ALL GOES: inside a [data-spin-when="form"] panel on the spin
     page. That panel gates the wheel — the script renders the wheel behind it
     and only flips to state "ready" once this form is submitted.

     THE ID / PASSPORT TOGGLE IS NOT HERE ON PURPOSE. Build it as two plain
     Webflow divs, like the onboarding gender pills, and put
     data-spin-lead-idtype="id" / "passport" on them. See the bottom of this
     file.

     WHAT REACHES THE BACKEND
       phone → PATCH /sessions/{id}/contact/phone
       email → PATCH /sessions/{id}/contact/email
     name, surname, id_type and id_number have NO endpoint in the API
     contract. They are buffered on Flexicare.lead in memory and are lost on
     a hard reload. Temporary — see docs/spin-attributes.md § the lead form.
     ============================================================ -->


<!-- ============================ 1. Name ============================ -->
<!-- Name -->
<div class="fc-field">
  <input class="fc-field-input" type="text" placeholder="Name" autocomplete="given-name" data-spin-lead-name />
</div>


<!-- ========================== 2. Surname ========================== -->
<!-- Surname -->
<div class="fc-field">
  <input class="fc-field-input" type="text" placeholder="Surname" autocomplete="family-name" data-spin-lead-surname />
</div>


<!-- ====================== 3. Cellphone number ====================== -->
<!-- Cellphone number -->
<div class="fc-field">
  <input class="fc-field-input" type="tel" inputmode="tel" placeholder="e.g. 071 234 5678" autocomplete="tel" data-spin-lead-phone />
</div>


<!-- ======================= 4. Email address ======================= -->
<!-- Email address -->
<div class="fc-field">
  <input class="fc-field-input" type="email" inputmode="email" placeholder="Email address" autocomplete="email" data-spin-lead-email />
</div>


<!-- ========================= 5. ID number ========================= -->
<!-- ID / passport number. The placeholder stays generic because the label
     above it is what changes with the toggle (put data-spin-lead-idlabel on
     that label and the script rewrites it). -->
<div class="fc-field">
  <input class="fc-field-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="ID Number" data-spin-lead-idnumber />
</div>


<!-- ====================== 6. The error message ======================
     ONE box for the whole form, not one per field — the script writes a
     single message and hides the box while it is empty. Put it just above
     the submit button. Styled like the onboarding .fc-error. -->
<div class="fc-error" data-spin-lead-error style="display:none"></div>


<!-- ============================================================
     THE ID / PASSPORT TOGGLE — build this in the Designer, not here.

     Two plain divs, exactly like the onboarding gender pills:

       Doc Type Row            (your flex wrapper)
       ├── Doc Option          data-spin-lead-idtype="id"
       │   ├── Radio Dot       (your styled circle)
       │   └── Text            "ID"
       └── Doc Option          data-spin-lead-idtype="passport"
           ├── Radio Dot
           └── Text            "Passport"

     Put the attribute on the WHOLE clickable row, not the dot — the script
     delegates clicks and walks up from whatever was tapped, so the label and
     the dot both work as hit targets.

     The selected option gets a class toggled on it plus aria-checked:
       • class defaults to `is-selected`
       • override per element:  data-selected-class="YourComboClass"
       • to put the class on an INNER element (the dot) while keeping the
         whole row clickable:  data-selected-target=".your-dot-class"

     Style the "on" state on that class in the Designer. "id" is selected by
     default, so style that one as selected while you build.

     A native <input type="radio"> also works if you ever want one — the
     script syncs its checked state — but divs are the intended path here.
     ============================================================ -->
